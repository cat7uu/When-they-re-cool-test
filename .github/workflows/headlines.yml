# Every 30 minutes, fetch recent headlines and save them to the "data" branch
# as headlines.json. The site loads that file first so the map fills instantly,
# then asks GDELT directly for anything newer.
name: Update headlines

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/headlines.yml
      - scripts/fetch-headlines.mjs

permissions:
  contents: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch headlines
        run: node scripts/fetch-headlines.mjs out/headlines.json

      - name: Publish to the data branch
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headlines.json
          git commit -q -m "Update headlines"
          # Replace the branch each time so it stays one small commit.
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
